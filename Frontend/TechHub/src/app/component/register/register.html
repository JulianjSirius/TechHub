<div class="register-container">
  <div class="register-card">
    <h1 class="register-title">Registro</h1>

    <form class="register-form" (ngSubmit)="registrar()" #form="ngForm">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          [(ngModel)]="nombre"
          required
          placeholder="Tu nombre"
        />
      </div>

      <div class="field">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          required
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          required
          placeholder="********"
        />
      </div>

      <div class="field">
        <label for="confirmContrasena">Confirmar contraseña</label>
        <input
          id="confirmContrasena"
          name="confirmContrasena"
          type="password"
          [(ngModel)]="confirmContrasena"
          required
          placeholder="********"
        />
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <div *ngIf="mensaje" class="success-message">{{ mensaje }}</div>

      <button class="submit" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </button>

      <div class="secondary">
        <a routerLink="/Login">Volver al login</a>
      </div>
    </form>
  </div>
</div>
