<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>

    <form class="login-form" (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
      <div class="field">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          required
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          name="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          required
          placeholder="********"
        />
      </div>

      <div *ngIf="mensajeError" class="error-message">
        {{ mensajeError }}
      </div>

      <button class="submit" type="submit" [disabled]="loginForm.invalid">Entrar</button>

      <div class="login-links">
        <a routerLink="/Registro" class="link">Registrarme</a>
        <span class="link-separator">|</span>
        <a routerLink="/RecuperarContrasena" class="link">Olvidé mi contraseña</a>
      </div>
    </form>
  </div>
</div>
