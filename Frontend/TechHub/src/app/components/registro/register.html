<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">TH</div>
      <h1>Crea tu cuenta</h1>
      <p>Selecciona tu rol y completa los datos.</p>
    </div>
    <div class="auth-body">
      <form (ngSubmit)="registrar()" #form="ngForm">
        <div class="field">
          <label for="rol">Tipo de usuario</label>
          <select
            id="rol"
            name="rol"
            [ngModel]="rol()"
            (ngModelChange)="rol.set($event)"
          >
            <option value="Pasajero">Pasajero</option>
            <option value="Piloto">Piloto</option>
          </select>
        </div>
        <div class="field" style="margin-top:0.75rem;">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            [ngModel]="nombre()"
            (ngModelChange)="nombre.set($event)"
            required
            placeholder="Tu nombre"
          />
        </div>
        @if (rol() === 'Piloto') {
          <div class="field" style="margin-top:0.75rem;">
            <label for="licencia">Licencia de piloto</label>
            <input
              id="licencia"
              name="licencia"
              type="text"
              [ngModel]="licencia()"
              (ngModelChange)="licencia.set($event)"
              placeholder="Número de licencia"
            />
          </div>
        }
        <div class="field" style="margin-top:0.75rem;">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            required
            placeholder="tu@correo.com"
          />
        </div>
        <div class="field" style="margin-top:0.75rem;">
          <label for="contrasena">Contraseña</label>
          <input
            id="contrasena"
            name="contrasena"
            type="password"
            [ngModel]="contrasena()"
            (ngModelChange)="contrasena.set($event)"
            required
            placeholder="Crea una contraseña segura"
          />
        </div>
        <div class="field" style="margin-top:0.75rem;">
          <label for="confirmContrasena">Confirmar contraseña</label>
          <input
            id="confirmContrasena"
            name="confirmContrasena"
            type="password"
            [ngModel]="ConfirmarContrasena()"
            (ngModelChange)="ConfirmarContrasena.set($event)"
            required
            placeholder="Repite la contraseña"
          />
        </div>
        @if (error()) {
          <div class="alert alert-error" style="margin-top:1rem;">{{ error() }}</div>
        }
        @if (mensaje()) {
          <div class="alert alert-success" style="margin-top:1rem;">{{ mensaje() }}</div>
        }
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:1.25rem;" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Registrando...' : 'Crear cuenta' }}
        </button>
      </form>
    </div>
    <div class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/Login">Inicia sesión</a>
    </div>
  </div>
</div>
