<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="logo">TH</div>
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu correo y una nueva contraseña.</p>
    </div>
    <div class="auth-card-body">
      <form (ngSubmit)="enviarSolicitud()" #form="ngForm">
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            required
            placeholder="tu@correo.com"
          />
        </div>
        <div class="field" style="margin-top: 1rem;">
          <label for="nuevaContrasena">Nueva contraseña</label>
          <input
            id="nuevaContrasena"
            name="nuevaContrasena"
            type="password"
            [ngModel]="nuevaContrasena()"
            (ngModelChange)="nuevaContrasena.set($event)"
            required
            placeholder="Nueva contraseña"
          />
        </div>
        <div class="field" style="margin-top: 1rem;">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <input
            id="confirmarContrasena"
            name="confirmarContrasena"
            type="password"
            [ngModel]="confirmarContrasena()"
            (ngModelChange)="confirmarContrasena.set($event)"
            required
            placeholder="Repite la contraseña"
          />
        </div>
        @if (error()) {
          <div class="alert alert-error" style="margin-top: 1rem;">{{ error() }}</div>
        }
        @if (mensaje()) {
          <div class="alert alert-success" style="margin-top: 1rem;">{{ mensaje() }}</div>
        }
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:1.25rem;" [disabled]="form.invalid || sending()">
          {{ sending() ? 'Enviando...' : 'Restablecer contraseña' }}
        </button>
      </form>
    </div>
    <div class="auth-card-footer">
      <a routerLink="/Login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
