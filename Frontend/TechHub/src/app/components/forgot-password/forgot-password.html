<div class="forgot-container">
  <div class="forgot-card">
    <h1 class="forgot-title">Recuperar contraseña</h1>

    <p class="forgot-copy">
      Ingresa tu correo y te enviaremos los pasos para restablecer tu contraseña.
    </p>

    <form class="forgot-form" (ngSubmit)="enviarSolicitud()" #form="ngForm">
      <div class="field">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
          required
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="field">
        <label for="nuevaContrasena">Nueva contraseña</label>
        <input
          id="nuevaContrasena"
          name="nuevaContrasena"
          type="password"
          [ngModel]="nuevaContrasena()"
          (ngModelChange)="nuevaContrasena.set($event)"
          required
          placeholder="********"
        />
      </div>

      <div class="field">
        <label for="confirmarContrasena">Confirmar contraseña</label>
        <input
          id="confirmarContrasena"
          name="confirmarContrasena"
          type="password"
          [ngModel]="confirmarContrasena()"
          (ngModelChange)="confirmarContrasena.set($event)"
          required
          placeholder="********"
        />
      </div>

      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }
      @if (mensaje()) {
        <div class="success-message">{{ mensaje() }}</div>
      }

      <button class="btn btn-primary submit" type="submit" [disabled]="form.invalid || sending()">
        {{ sending() ? 'Enviando...' : 'Restablecer contraseña' }}
      </button>

      <div class="secondary">
        <button type="button" class="link" (click)="volverAlLogin()">Volver al login</button>
      </div>
    </form>
  </div>
</div>
