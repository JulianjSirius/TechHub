<div class="forgot-container">
  <div class="forgot-card">
    <h1 class="forgot-title">Recuperar contraseña</h1>

    <p class="forgot-copy">
      Ingresa tu correo y te enviaremos los pasos para restablecer tu contraseña.
    </p>

    <form class="forgot-form" (ngSubmit)="enviarSolicitud()" #form="ngForm">
      <div class="field">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          required
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <div *ngIf="mensaje" class="success-message">{{ mensaje }}</div>

      <button class="submit" type="submit" [disabled]="form.invalid || sending">
        {{ sending ? 'Enviando...' : 'Enviar instrucciones' }}
      </button>

      <div class="secondary">
        <button type="button" class="link" (click)="volverAlLogin()">Volver al login</button>
      </div>
    </form>
  </div>
</div>
