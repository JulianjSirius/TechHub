<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">TH</div>
      <h1>Bienvenido de vuelta</h1>
      <p>Ingresa tus credenciales para continuar.</p>
    </div>
    <div class="auth-body">
      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            required
            placeholder="tu@correo.com"
          />
        </div>
        <div class="field" style="margin-top:0.75rem;">
          <label for="contrasena">Contraseña</label>
          <input
            id="contrasena"
            name="contrasena"
            type="password"
            [ngModel]="contrasena()"
            (ngModelChange)="contrasena.set($event)"
            required
            placeholder="Ingresa tu contraseña"
          />
        </div>
        @if (mensajeError()) {
          <div class="alert alert-error" style="margin-top:1rem;">{{ mensajeError() }}</div>
        }
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:1.25rem;" [disabled]="loginForm.invalid || loading()">
          @if (loading()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          }
          {{ loading() ? 'Entrando...' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>
    <div class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/Registro">Regístrate</a>
      &nbsp;·&nbsp;
      <a routerLink="/RecuperarContrasena">Olvidé mi contraseña</a>
    </div>
  </div>
</div>
