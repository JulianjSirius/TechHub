<div class="servicios-container">
  <span class="pill">Servicios</span>
  <h1>Nuestros Servicios</h1>
  <p class="subtitulo">Descubre todas las soluciones que TechHub tiene para ti</p>

  <div class="servicios-grid">
    @for (servicio of servicios; track servicio.numero) {
      <div class="servicio-card">
        <div class="numero-circulo">{{ servicio.numero }}</div>
        <span class="icono-grande">{{ servicio.icono }}</span>
        <h2>{{ servicio.titulo }}</h2>
        <p>{{ servicio.descripcion }}</p>
      </div>
    }
  </div>
</div>
