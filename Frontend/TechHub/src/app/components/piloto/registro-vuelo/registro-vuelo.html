<div style="max-width:600px;">
  <div class="page-header">
    <div>
      <span class="badge badge-accent">Vuelos</span>
      <h1 style="margin-top:0.5rem;">Registro de vuelos</h1>
      <p>Planifica nuevas rutas y define fechas de salida.</p>
    </div>
  </div>

  <div class="card" style="padding:1.5rem;">
    <form (ngSubmit)="registrar()" #form="ngForm">
      <div class="field">
        <label for="origen">Origen</label>
        <input
          id="origen"
          name="origen"
          type="text"
          [ngModel]="origen()"
          (ngModelChange)="origen.set($event)"
          required
          placeholder="Ciudad o código"
        />
      </div>

      <div class="field" style="margin-top:1rem;">
        <label for="destino">Destino</label>
        <input
          id="destino"
          name="destino"
          type="text"
          [ngModel]="destino()"
          (ngModelChange)="destino.set($event)"
          required
          placeholder="Ciudad o código"
        />
      </div>

      <div class="field" style="margin-top:1rem;">
        <label for="fechaSalida">Fecha de salida</label>
        <input
          id="fechaSalida"
          name="fechaSalida"
          type="datetime-local"
          [ngModel]="fechaSalida()"
          (ngModelChange)="fechaSalida.set($event)"
          required
        />
      </div>

      @if (error()) {
        <div class="alert alert-error" style="margin-top:1rem;">{{ error() }}</div>
      }
      @if (mensaje()) {
        <div class="alert alert-success" style="margin-top:1rem;">{{ mensaje() }}</div>
      }

      <button class="btn btn-primary" type="submit" style="margin-top:1.25rem;" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Guardando...' : 'Registrar vuelo' }}
      </button>
    </form>
  </div>
</div>
