<div class="max-w-2xl mx-auto font-sans">
  <div class="mb-8 animate-fade-in">
    <span
      class="px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 rounded-full border border-cyan-500/20"
    >
      Operaciones
    </span>
    <h1 class="text-3xl font-black text-white mt-4 font-display tracking-tight">
      Registro de Vuelos
    </h1>
    <p class="text-sm text-slate-400 mt-2">
      Planifica nuevas rutas, define fechas de salida y asigna el equipo.
    </p>
  </div>

  <div
    class="bg-[#0c0e17]/80 backdrop-blur-xl border border-slate-800/60 p-6 sm:p-8 rounded-3xl shadow-2xl shadow-black/50"
  >
    <form (ngSubmit)="registrar()" #form="ngForm" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label
            for="origen"
            class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
            >Origen</label
          >
          <div class="relative">
            <select
              id="origen"
              name="origen"
              [ngModel]="origen()"
              (ngModelChange)="onOrigenChange($event)"
              required
              class="w-full px-4 py-3.5 bg-[#07080e] border border-slate-800 rounded-xl text-white appearance-none focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all cursor-pointer"
            >
              <option value="" disabled selected>Seleccione el origen...</option>

              @for (aero of aeropuertosLista(); track aero.id) {
                <option [value]="aero.ciudad">{{ aero.ciudad }} ({{ aero.nombre }})</option>
              }
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-cyan-500"
            >
              ▼
            </div>
          </div>
        </div>

        <div>
          <label
            for="destino"
            class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
            >Destino</label
          >
          <div class="relative">
            <select
              id="destino"
              name="destino"
              [ngModel]="destino()"
              (ngModelChange)="onDestinoChange($event)"
              required
              class="w-full px-4 py-3.5 bg-[#07080e] border border-slate-800 rounded-xl text-white appearance-none focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all cursor-pointer"
            >
              <option value="" disabled selected>Seleccione el destino...</option>

              @for (aero of destinosDisponibles; track aero.id) {
                <option [value]="aero.ciudad">{{ aero.ciudad }} ({{ aero.nombre }})</option>
              }
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-cyan-500"
            >
              ▼
            </div>
          </div>
        </div>
      </div>

      <div>
        <label
          for="fechaSalida"
          class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
          >Fecha y Hora de Salida</label
        >
        <input
          id="fechaSalida"
          name="fechaSalida"
          type="datetime-local"
          [ngModel]="fechaSalida()"
          (ngModelChange)="fechaSalida.set($event)"
          required
          class="w-full px-4 py-3.5 bg-[#07080e] border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all [color-scheme:dark]"
        />
      </div>

      @if (error()) {
        <div
          class="p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-sm flex items-center gap-3 animate-fade-in font-mono tracking-wide"
        >
          <span class="text-lg">⚠️</span> SYSTEM_ERROR: {{ error() }}
        </div>
      }
      @if (mensaje()) {
        <div
          class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-sm flex items-center gap-3 animate-fade-in font-mono tracking-wide"
        >
          <span class="text-lg">✅</span> LOG_SUCCESS: {{ mensaje() }}
        </div>
      }

      <div class="pt-4">
        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="w-full py-4 px-4 bg-cyan-500 hover:bg-cyan-400 disabled:bg-slate-800 disabled:text-slate-500 text-black font-bold tracking-wide uppercase rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-3"
        >
          @if (loading()) {
            <span
              class="animate-spin h-5 w-5 border-2 border-slate-500 border-t-white rounded-full"
            ></span>
            Procesando Telemetría...
          } @else {
            <span>✈️</span> Registrar Plan de Vuelo
          }
        </button>
      </div>
    </form>
  </div>
</div>
