<div
  class="relative min-h-screen flex items-center justify-center bg-slate-900 overflow-hidden font-sans"
>
  <div
    class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"
  ></div>
  <div
    class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"
  ></div>

  <div
    class="relative w-full max-w-md p-8 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl"
  >
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 mx-auto bg-gradient-to-br from-cyan-400 to-pink-500 rounded-xl flex items-center justify-center shadow-lg mb-4"
      >
        <span class="text-2xl font-bold text-white">SS</span>
      </div>
      <h2 class="text-3xl font-bold text-white tracking-wide">SkySync</h2>
      <p class="text-slate-300 mt-2 text-sm">Portal de Gestión Aeronáutica</p>
    </div>

    @if (mensajeError()) {
      <div
        class="mb-6 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-200 text-sm text-center"
      >
        {{ mensajeError() }}
      </div>
    }

    <form class="space-y-6" (ngSubmit)="iniciarSesion()">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
        <input
          type="email"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
          name="correo"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
          placeholder="usuario@skysync.com"
          required
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
        <input
          type="password"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event)"
          name="contrasena"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
          placeholder="••••••••"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-3 px-4 bg-cyan-500 hover:bg-cyan-400 disabled:bg-slate-600 disabled:cursor-not-allowed text-slate-900 font-bold rounded-lg transition-all shadow-lg shadow-cyan-500/30 flex justify-center items-center gap-2"
      >
        @if (loading()) {
          <span
            class="animate-spin h-5 w-5 border-2 border-slate-900 border-t-transparent rounded-full"
          ></span>
          Ingresando...
        } @else {
          Iniciar Sesión
        }
      </button>

      <div class="text-center mt-6">
        <p class="text-sm text-slate-400">
          ¿No tienes cuenta?
          <a
            routerLink="/Registro"
            class="text-cyan-400 hover:text-cyan-300 font-medium transition-colors"
            >Regístrate aquí</a
          >
        </p>
        <p class="text-sm text-slate-400 mt-2">
          <a routerLink="/RecuperarContrasena" class="hover:text-white transition-colors"
            >¿Olvidaste tu contraseña?</a
          >
        </p>
      </div>
    </form>
  </div>
</div>
