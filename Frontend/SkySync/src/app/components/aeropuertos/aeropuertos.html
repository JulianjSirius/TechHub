<div class="p-6 text-slate-300">
  <h2 class="text-2xl font-bold mb-6 text-white">Gestión de Aeropuertos</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    @for (aeropuerto of aeropuertos(); track aeropuerto.id) {
      <div class="bg-[#0c0e17] p-4 rounded-xl border border-slate-700">
        <h4 class="font-bold text-white">{{ aeropuerto.nombre }}</h4>
        <p class="text-sm text-slate-400">{{ aeropuerto.ciudad }}</p>
        
        <span class="px-2 py-1 text-xs rounded border {{ getColorEstado(aeropuerto.estado) }}">
          {{ aeropuerto.estado }}
        </span>

        @if (auth.isPiloto()) {
          <select (change)="cambiarEstado(aeropuerto.id, $event)" class="mt-4 w-full bg-[#161a2b] p-2 rounded text-xs">
            <option value="Disponible">Disponible</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Sin uso">Sin uso</option>
          </select>
        }
      </div>
    }
  </div>
</div>
